name: Deploy finance dashboard

on:
  push:
    branches:
      - main
      - juliagabriellerocha-lgtm-performance-analysis
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/icons
          cp index.html app.js styles.css manifest.webmanifest sw.js _site/
          cp icons/* _site/icons/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
