<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Painel da Ju — Júlia Rocha</title>
<style>
  :root{
    --bg:#F4F6F1;
    --surface:#FFFFFF;
    --surface-2:#EBEEE6;
    --ink:#1A2420;
    --ink-soft:#566158;
    --ink-faint:#8A9285;
    --line:#D3DACB;
    --prof:#155263;   --prof-soft:#E1EBEC;
    --pess:#B8842A;   --pess-soft:#F3E9D3;
    --warn:#A6432E;   --warn-soft:#F3E0D9;
    --ok:#3F7A52;     --ok-soft:#DFEBE2;
    --diet:#4C7A3D;   --diet-soft:#E3ECDB;
    --treino:#C14C64; --treino-soft:#F6E1E6;
    --rotina:#55708A; --rotina-soft:#E3EAF0;
    --compras:#155263; --compras-soft:#E1EBEC;
    --leitura:#8B6B4A; --leitura-soft:#EFE6DA;
    --fe:#7A5FA6; --fe-soft:#ECE6F5;
    --academico:#3D5A99; --academico-soft:#E2E8F5;
    --complementar:#C2703A; --complementar-soft:#F5E4D5;
    --profissional:#3A4A6B; --profissional-soft:#E4E7EE;
    --progresso:#1F8A8A; --progresso-soft:#DFF0EF;
    --projecoes:#5A4A9E; --projecoes-soft:#E9E6F5;
    --radius-card:10px;
    --radius-chip:999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121815; --surface:#1A211D; --surface-2:#212923;
      --ink:#EDEFE7; --ink-soft:#9FAA9C; --ink-faint:#697267; --line:#37423B;
      --prof:#5FBBD1;   --prof-soft:#1B3238;
      --pess:#E0AA55;   --pess-soft:#3A2E16;
      --warn:#E1876F;   --warn-soft:#3B241D;
      --ok:#7FBF93;     --ok-soft:#1E3324;
      --diet:#8FC17B;   --diet-soft:#1F2E1A;
      --treino:#E38399; --treino-soft:#3A1E24;
      --rotina:#93AEC6; --rotina-soft:#212C36;
      --compras:#5FBBD1; --compras-soft:#1B3238;
      --leitura:#C7A47E; --leitura-soft:#2E2418;
      --fe:#B79FE0; --fe-soft:#2A2338;
      --academico:#7FA0D9; --academico-soft:#1C2838;
      --complementar:#E0A06B; --complementar-soft:#33241A;
      --profissional:#8B9BC0; --profissional-soft:#232A38;
      --progresso:#5FCBCB; --progresso-soft:#173030;
      --projecoes:#A79BE0; --projecoes-soft:#2C2748;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121815; --surface:#1A211D; --surface-2:#212923;
    --ink:#EDEFE7; --ink-soft:#9FAA9C; --ink-faint:#697267; --line:#37423B;
    --prof:#5FBBD1;   --prof-soft:#1B3238;
    --pess:#E0AA55;   --pess-soft:#3A2E16;
    --warn:#E1876F;   --warn-soft:#3B241D;
    --ok:#7FBF93;     --ok-soft:#1E3324;
    --diet:#8FC17B;   --diet-soft:#1F2E1A;
    --treino:#E38399; --treino-soft:#3A1E24;
    --rotina:#93AEC6; --rotina-soft:#212C36;
    --compras:#5FBBD1; --compras-soft:#1B3238;
    --leitura:#C7A47E; --leitura-soft:#2E2418;
    --fe:#B79FE0; --fe-soft:#2A2338;
    --academico:#7FA0D9; --academico-soft:#1C2838;
    --complementar:#E0A06B; --complementar-soft:#33241A;
    --profissional:#8B9BC0; --profissional-soft:#232A38;
    --progresso:#5FCBCB; --progresso-soft:#173030;
    --projecoes:#A79BE0; --projecoes-soft:#2C2748;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:960px; margin:0 auto; padding:0 20px 72px; }

  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  .kicker{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }

  /* ---------- app bar ---------- */
  .appbar{ position:sticky; top:0; z-index:5; background:var(--bg); padding-top:22px; }
  .appbar-top{ display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; padding-bottom:16px; }
  .brand h1{ font-size:22px; letter-spacing:-.01em; }
  .brand .kicker{ margin-bottom:4px; display:block; }
  .today{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:11px; color:var(--ink-faint); text-align:right; }
  .save-status{ font-size:10px; text-align:right; padding-bottom:10px; color:var(--ink-faint); min-height:13px; }
  .save-status.saving{ color:var(--ink-faint); }
  .save-status.ok{ color:var(--ok); }
  .save-status.error{ color:var(--warn); font-weight:600; }
  .tabs{ display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:'Work Sans', sans-serif; font-size:13px; font-weight:600;
    color:var(--ink-faint); padding:11px 14px; white-space:nowrap;
    border-bottom:2.5px solid transparent; margin-bottom:-1px;
    transition:color .12s ease, border-color .12s ease;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn[aria-selected="true"]{ color:var(--tab-c); border-color:var(--tab-c); }
  main{ padding-top:26px; }
  .panel{ display:flex; flex-direction:column; gap:22px; }

  /* ---------- generic cards ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:16px 18px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .section-head h2{ font-size:19px; }
  .section-lede{ font-size:13px; line-height:1.6; color:var(--ink-soft); max-width:62ch; margin:2px 0 2px; }

  .stat-tiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px 16px; }
  .stat-tile .label{ font-family:'IBM Plex Mono'; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 7px; }
  .stat-tile .value{ font-family:'Fraunces'; font-weight:600; font-size:21px; font-variant-numeric:tabular-nums; margin:0 0 3px; }
  .stat-tile .hint{ font-size:11px; color:var(--ink-faint); line-height:1.4; }
  .stat-tile.tone-warn .value{ color:var(--warn); }
  .stat-tile.tone-ok .value{ color:var(--ok); }
  .stat-tile.tone-t .value{ color:var(--tab-c); }

  .chip{ font-family:'IBM Plex Mono'; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); border-radius:var(--radius-chip); padding:2px 8px; white-space:nowrap; }
  .chip.on-tab{ color:var(--tab-c); background:color-mix(in srgb, var(--tab-c) 14%, var(--surface-2)); }
  .chip.paid{ color:var(--ok); background:var(--ok-soft); }

  .btn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Work Sans'; font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:8px; cursor:pointer; }
  .btn:hover{ border-color:var(--tab-c); color:var(--tab-c); }
  .btn.primary{ background:var(--tab-c); border-color:var(--tab-c); color:var(--surface); }
  .btn.primary:hover{ opacity:.9; color:var(--surface); }
  .btn.ghost{ border-color:transparent; background:none; padding:6px 8px; color:var(--ink-faint); }
  .btn.ghost:hover{ color:var(--warn); border-color:transparent; }
  .btn.small{ font-size:11px; padding:6px 10px; }

  .progress{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .progress > i{ display:block; height:100%; background:var(--tab-c); border-radius:999px; transition:width .25s ease; }

  input[type=text], input[type=number], textarea{
    width:100%; font-family:'Work Sans'; font-size:13px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px; resize:none;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus, [contenteditable]:focus{
    outline:2px solid var(--tab-c); outline-offset:1px; background:var(--surface);
  }
  input[type=checkbox]{ width:17px; height:17px; accent-color:var(--tab-c); flex:none; cursor:pointer; }

  /* ---------- Metas panel (life map) ---------- */
  .root-node{ width:min(300px,90%); margin:0 auto; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:18px 22px; }
  .root-node .name{ font-family:'Fraunces'; font-weight:600; font-size:20px; margin:0 0 4px; }
  .root-node .sub{ font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:0; }
  .stem{ width:2px; height:24px; background:var(--line); margin:0 auto; }
  .trunks{ display:flex; justify-content:center; gap:48px; position:relative; }
  .trunk{ flex:1 1 0; min-width:0; }
  .trunk-head{ display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Fraunces'; font-weight:600; font-size:17px; margin:0 0 16px; color:var(--trunk-c); }
  .trunk-head .badge{ width:9px; height:9px; border-radius:3px; background:var(--trunk-c); flex:none; }
  .trunk--prof{ --trunk-c:var(--prof); }
  .trunk--pess{ --trunk-c:var(--pess); }
  .branch-list{ border-left:2px solid var(--line); margin-left:8px; padding-left:18px; display:flex; flex-direction:column; gap:12px; }
  .category-node{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:13px 15px; }
  .category-node::before{ content:''; position:absolute; left:-18px; top:16px; width:16px; height:2px; background:var(--line); }
  .category-title{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; margin:0 0 10px; }
  .category-title .stub{ width:6px; height:6px; border-radius:50%; background:var(--trunk-c); flex:none; }
  .goal-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .goal-row{ display:flex; align-items:baseline; gap:8px; }
  .goal-dot{ width:9px; height:9px; border-radius:50%; margin-top:4px; flex:none; cursor:pointer; border:1.6px solid var(--trunk-c); background:transparent; padding:0; }
  .goal-dot[data-status="andamento"]{ background:var(--trunk-c); }
  .goal-dot[data-status="sonho"]{ border-style:dashed; }
  .goal-text{ color:var(--ink); font-size:13px; line-height:1.5; flex:1; }
  .goal-status-label{ font-family:'IBM Plex Mono'; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap; }
  .legend{ display:flex; flex-wrap:wrap; gap:16px; font-size:11.5px; color:var(--ink-soft); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend .goal-dot{ cursor:default; border-color:var(--ink-soft); }
  .legend .goal-dot[data-status="andamento"]{ background:var(--ink-soft); }

  .timeline{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:680px){ .timeline{ grid-template-columns:1fr; } .trunks{ flex-direction:column; gap:26px; } }
  .horizon-label{ font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); border-top:2px solid var(--line); padding-top:8px; margin-bottom:10px; }
  .horizon-label b{ display:block; font-family:'Fraunces'; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); margin-top:2px; }
  .dream-item{ display:flex; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:9px 11px; margin-bottom:8px; }
  .dream-item .goal-dot{ border-color:var(--pess); }
  .dream-item .goal-dot[data-status="andamento"]{ background:var(--pess); }
  .dream-body .txt{ font-size:12.5px; line-height:1.45; color:var(--ink); display:block; }
  .dream-body .req{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--ink-faint); line-height:1.5; }

  .wish-groups{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px 20px; }
  .wish-group-title{ font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 8px; }
  .wish-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .wish-chip{ background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:12px; color:var(--ink); }

  /* ---------- Dívidas panel ---------- */
  .debt-group{ margin-bottom:4px; }
  .debt-group-title{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .debt-row{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .debt-row:first-of-type{ border-top:none; }
  .debt-row.is-paid .debt-label{ color:var(--ink-faint); text-decoration:line-through; }
  .debt-label{ flex:1; font-size:13px; line-height:1.45; }
  .debt-note{ display:block; font-size:11px; color:var(--warn); margin-top:2px; }
  .debt-value{ font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; padding-top:1px; }
  .callout{ background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--radius-card); padding:14px 16px; }
  .callout .co-title{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--warn); margin:0 0 8px; }
  .callout .mark{ width:7px; height:7px; border-radius:50%; background:var(--warn); flex:none; }
  .callout ul{ margin:0; padding-left:16px; display:flex; flex-direction:column; gap:5px; }
  .callout li{ font-size:12px; line-height:1.55; color:var(--ink); }

  .sermar-bar{ display:flex; align-items:center; gap:12px; }
  .sermar-bar .progress{ flex:1; }
  .lawsuit-row{ display:grid; grid-template-columns:1.3fr 1fr 1fr .8fr 1.4fr auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .lawsuit-row:first-of-type{ border-top:none; }
  .lawsuit-head{ display:grid; grid-template-columns:1.3fr 1fr 1fr .8fr 1.4fr auto; gap:8px; font-family:'IBM Plex Mono'; font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding-bottom:6px; }
  @media (max-width:760px){ .lawsuit-row, .lawsuit-head{ grid-template-columns:1fr; } .lawsuit-head{ display:none; } .lawsuit-row{ background:var(--surface-2); border-radius:8px; padding:10px; border-top:none; margin-bottom:8px; } }

  /* ---------- Dieta panel ---------- */
  .diet-grid{ display:grid; grid-template-columns:90px repeat(4,1fr); gap:6px; overflow-x:auto; }
  .diet-grid .hcell{ font-family:'IBM Plex Mono'; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:4px 2px; }
  .diet-grid .daylabel{ font-size:12px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; padding:4px 2px; }
  .diet-cell{ min-height:44px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:7px 8px; font-size:12px; line-height:1.4; color:var(--ink); cursor:text; }
  .diet-cell:empty::before{ content:attr(data-placeholder); color:var(--ink-faint); }
  .today-card{ display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  .water-dots{ display:flex; gap:6px; }
  .water-dot{ width:22px; height:22px; border-radius:50%; border:1.6px solid var(--diet); background:transparent; cursor:pointer; padding:0; }
  .water-dot.filled{ background:var(--diet); }
  .today-notes{ flex:1; min-width:220px; }
  .today-notes textarea{ min-height:64px; }

  /* ---------- Treino panel ---------- */
  .week-row{ display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .week-row:first-of-type{ border-top:none; }
  .week-row .daylabel{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .week-row.is-today .daylabel{ color:var(--treino); }
  .streak-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .mini-cal{ display:flex; gap:5px; }
  .mini-cal .d{ width:26px; height:26px; border-radius:7px; border:1.6px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:9px; color:var(--ink-faint); }
  .mini-cal .d.done{ background:var(--treino); border-color:var(--treino); color:var(--surface); }
  .mini-cal .d.today{ border-color:var(--treino); border-width:2px; }
  .check-label{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .wcards-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .wcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px 16px; }
  .wcard-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .wcard-letter{ font-family:'Fraunces'; font-weight:600; font-size:17px; color:var(--treino); background:var(--treino-soft); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .wcard-title{ font-size:13px; font-weight:600; line-height:1.3; }
  .wcard-day{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
  .wblock{ margin-bottom:9px; }
  .wblock:last-child{ margin-bottom:0; }
  .wblock-title{ font-family:'IBM Plex Mono'; font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:4px; }
  .wex-row{ display:flex; justify-content:space-between; gap:8px; padding:2.5px 0; font-size:12px; }
  .wex-row .n{ color:var(--ink); }
  .wex-row .s{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }

  /* ---------- Rotina panel ---------- */
  .routine-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .routine-row:first-of-type{ border-top:none; }
  .routine-row label{ flex:1; font-size:13px; }
  .routine-row.done label{ color:var(--ink-faint); text-decoration:line-through; }
  .add-row{ display:flex; gap:8px; margin-top:12px; }
  .add-row input{ flex:1; }

  /* ---------- Compras panel ---------- */
  .shop-group{ margin-bottom:4px; }
  .shop-group-title{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:0 0 6px; }
  .shop-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .shop-row:first-of-type{ border-top:none; }
  .shop-row label{ flex:1; font-size:13px; }
  .shop-row.done label{ color:var(--ink-faint); text-decoration:line-through; }
  .shop-row .btn.ghost{ padding:4px 6px; }

  /* ---------- generic checklist (reused by Leitura, Espiritualidade, Estudos, Profissional) ---------- */
  .glist-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .glist-row:first-of-type{ border-top:none; }
  .glist-row label{ flex:1; font-size:13px; }
  .glist-row.done label{ color:var(--ink-faint); text-decoration:line-through; }
  .empty-state{ text-align:center; padding:28px 16px; color:var(--ink-faint); font-size:13px; }
  .empty-state .big{ font-size:28px; display:block; margin-bottom:8px; }
  .subhead{ font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 8px; }
  .subhead:first-child{ margin-top:0; }
  textarea.reflect{ min-height:70px; margin-top:6px; }
  .field-label{ font-size:11.5px; color:var(--ink-faint); margin:10px 0 4px; display:block; }

  /* ---------- Progresso panel ---------- */
  .chart-block{ margin-bottom:18px; }
  .chart-block:last-child{ margin-bottom:0; }
  .chart-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .chart-head .t{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .chart-head .v{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); }
  .heat-row{ display:flex; gap:3px; }

  .foot{ margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-faint); line-height:1.6; }

  function cloneDefaults(){ return JSON.parse(JSON.stringify(DEFAULTS)); }
  function mergeDefaults(saved){
    var base = cloneDefaults();
    if(saved && typeof saved === "object"){
      Object.keys(base).forEach(function(k){ if(saved[k] !== undefined) base[k] = saved[k]; });
    }
    return base;
  }

  // ---------- save status (visible feedback, so a failed save is never silent) ----------
  var saveFailCount = 0;
  var saveRetryTimer = null;
  function setSaveStatus(kind, text){
    var el = document.getElementById("saveStatus");
    if(!el) return;
    el.className = "save-status mono" + (kind ? " "+kind : "");
    el.textContent = text;
  }
  function persist(){
    if(!stateDoc){
      setSaveStatus("error", "Alterações não estão sendo salvas — recarregue a página");
      return;
    }
    if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
    setSaveStatus("saving", "Salvando…");
    stateDoc.set(state).then(function(){
      saveFailCount = 0;
      var now = new Date();
      var hh = String(now.getHours()).padStart(2,"0"), mm = String(now.getMinutes()).padStart(2,"0");
      setSaveStatus("ok", "Salvo às "+hh+":"+mm);
    }).catch(function(e){
      console.warn("painel: falha ao salvar", e);
      saveFailCount++;
      if(saveFailCount <= 5){
        setSaveStatus("error", "Não salvou, tentando de novo…");
        saveRetryTimer = setTimeout(persist, 2000 * saveFailCount);
      } else {
        setSaveStatus("error", "Não foi possível salvar — recarregue a página antes de continuar");
      }
    });
  }

  function migratePreviousPanel(previous){
    state.previousPanelData=previous;
    var migratedItems={};
    function addItems(items,prefix,label){
      if(!Array.isArray(items)) return;
      items.forEach(function(item){
        if(!item||typeof item.name!=="string"&&typeof item.text!=="string") return;
        var name=item.name||item.text;
        if(!name.trim()) return;
        var id=prefix+"-"+String(item.id||uid(prefix));
        state.routine.items.push({id:id,text:label+name.trim()});
        migratedItems[prefix+":"+item.id]=id;
      });
    }
    addItems(previous.habits,"previous-habit","Hábito · ");
    addItems(previous.routines,"previous-routine","Rotina · ");
    if(previous.entries&&typeof previous.entries==="object"){
      Object.keys(previous.entries).forEach(function(date){
        var entry=previous.entries[date];
        if(!entry||typeof entry!=="object") return;
        var log=state.routine.log[date]||{};
        Object.keys(entry.habits||{}).forEach(function(id){if(entry.habits[id]&&migratedItems["previous-habit:"+id])log[migratedItems["previous-habit:"+id]]=true;});
        Object.keys(entry.routines||{}).forEach(function(id){if(entry.routines[id]&&migratedItems["previous-routine:"+id])log[migratedItems["previous-routine:"+id]]=true;});
        state.routine.log[date]=log;
        if(entry.reflection){
          state.spirituality.dailyLog[date]=state.spirituality.dailyLog[date]||{tema:"",leitura:"",aplicacao:""};
          state.spirituality.dailyLog[date].aplicacao=entry.reflection;
        }
      });
    }
    if(Array.isArray(previous.projects)){
      previous.projects.forEach(function(project){
        if(!project||typeof project.name!=="string"||!project.name.trim())return;
        state.goals.push({
          id:"previous-"+String(project.id||uid("goal")),
          trunk:"prof",
          cat:"Metas adicionadas no painel inicial",
          text:project.name.trim()+" — progresso registrado: "+Math.max(0,Math.min(100,Number(project.progress)||0))+"%"+
            (project.dueDate?" · prazo "+project.dueDate:""),
          status:Number(project.progress)>0?"andamento":"planejado"
        });
      });
    }
  }

  function initBackups(){
    var exportButton=document.getElementById("exportBackup");
    var importButton=document.getElementById("importBackupButton");
    var input=document.getElementById("importBackup");
    exportButton.addEventListener("click",function(){
      var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var link=document.createElement("a");
      link.href=url;link.download="painel-ju-backup-"+todayKey()+".json";link.click();
      URL.revokeObjectURL(url);
    });
    importButton.addEventListener("click",function(){input.click();});
    input.addEventListener("change",async function(){
      var file=input.files&&input.files[0];
      if(!file)return;
      var priorState=state;
      try{
        var data=JSON.parse(await file.text());
        if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Formato de backup inválido.");
        if(!window.confirm("Restaurar este backup? Os dados salvos atualmente neste navegador serão substituídos."))return;
        if(!stateDoc)throw new Error("O armazenamento local não está disponível neste navegador.");
        state=mergeDefaults(data);
        reconcileState();
        await stateDoc.set(state);
        setSaveStatus("ok","Backup restaurado");
        renderAll();
      }catch(error){
        state=priorState;
        console.error("Falha ao restaurar backup:",error);
        window.alert("Não foi possível restaurar este backup: "+error.message);
      }finally{
        input.value="";
      }
    });
  }

        '<div class="streak-row">'+
          '<div><p class="stat-tile-value mono" style="font-family:Fraunces;font-size:26px;font-weight:600;color:var(--treino);margin:0;">'+streak+'</p><p class="hint" style="color:var(--ink-faint);font-size:11px;">dia(s) seguidos</p></div>'+

    // ---------- agenda: próximos compromissos (alerta na véspera e no dia) ----------
    var todayMid = new Date(); todayMid.setHours(0,0,0,0);

      return { a:a, d:d, diff:Math.round((d - todayMid)/86400000) };
    }).filter(function(x){ return x.diff >= 0; }).sort(function(x,y){
      return x.diff - y.diff || String(x.a.time||"").localeCompare(String(y.a.time||""));

    var agendaHtml = upcoming.length ?

        upcoming.map(function(x){
          var a = x.a;
          var when = x.diff===0 ? "Hoje" : (x.diff===1 ? "Amanhã" : "em "+x.diff+" dias");
          var urgent = x.diff<=1;
          var dLabel = x.d.toLocaleDateString("pt-BR",{weekday:"short", day:"2-digit", month:"2-digit"});
          return '<div class="debt-row">'+
            '<div class="debt-label"><b>'+esc(a.title||"Compromisso")+'</b>'+
              '<span style="display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;">'+esc(dLabel)+(a.time?' · '+esc(a.time):'')+(a.place?' · '+esc(a.place):'')+'</span>'+
              (a.phone?'<span style="display:block;font-size:11.5px;color:var(--ink-soft);">Tel.: <a href="tel:'+esc(String(a.phone).replace(/\D/g,""))+'" style="color:inherit">'+esc(a.phone)+'</a></span>':'')+
              (urgent?'<span class="debt-note">Lembrete: '+(x.diff===0?'é hoje!':'é amanhã — se organize.')+'</span>':'')+
            '</div>'+
            '<span class="chip'+(urgent?'':' on-tab')+'"'+(urgent?' style="color:var(--warn);background:var(--warn-soft)"':'')+'>'+when+'</span>'+
          '</div>';
        }).join("")+
      '</div>' : "";

    el.innerHTML =
      sundayHtml+
      '<div class="card">'+
        '<div class="kicker">'+dateLabel+'</div>'+

      agendaHtml+

        '<div class="section-head"><h2>Tema litúrgico de hoje</h2></div>'+

  // ---------- render: Progresso ----------
  function radialGauge(pct, color, size){
    size = size || 118;
    var r = size/2 - 11, c = size/2;
    var circumference = 2*Math.PI*r;
    var clamped = Math.max(0, Math.min(100, pct));
    var offset = circumference * (1 - clamped/100);
    return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="display:block;flex:none;">'+
      '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="11"/>'+
      '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+circumference.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')" style="transition:stroke-dashoffset .3s ease;"/>'+
      '<text x="'+c+'" y="'+(c+7)+'" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="24" fill="var(--ink)">'+Math.round(clamped)+'%</text>'+
    '</svg>';
  }

  function barsSvg(values, max, fmt){
    var w = 300, h = 64, n = values.length, gap = 3;
    var bw = (w - gap*(n-1)) / n;
    var bars = values.map(function(v,i){
      var bh = Math.max(2, (v/max)*h);
      var x = i*(bw+gap);
      var y = h-bh;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(1,bw).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--tab-c)"><title>'+fmt(v)+'</title></rect>';
    }).join("");
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="64" preserveAspectRatio="none" style="display:block;overflow:visible;">'+
      '<line x1="0" y1="'+(h-0.5)+'" x2="'+w+'" y2="'+(h-0.5)+'" stroke="var(--line)" stroke-width="1"/>'+
      bars+
    '</svg>';
  }

  function renderProgresso(){
    var el = document.getElementById("panel-progresso");
    var N = 14;
    var days = [];
    for(var i=N-1;i>=0;i--) days.push(todayKey(-i));

    var routineTotal = state.routine.items.length || 1;
    var routinePct = days.map(function(d){
      var log = state.routine.log[d] || {};
      var done = state.routine.items.filter(function(it){ return log[it.id]; }).length;
      return Math.round((done/routineTotal)*100);
    });
    var routineAvg = Math.round(routinePct.reduce(function(a,b){return a+b;},0)/N);

    var waterVals = days.map(function(d){ return (state.diet.log[d] && state.diet.log[d].water) || 0; });
    var waterGoalDays = waterVals.filter(function(v){ return v>=6; }).length;

    var treinoHeat = days.map(function(d){ return !!state.workout.log[d]; });
    var streak = 0;
    for(var j=0;j<365;j++){ if(state.workout.log[todayKey(-j)]) streak++; else break; }

    var debtsPago = state.debts.filter(function(d){ return d.status==="pago"; }).length;
    var totalMaterias = state.academico.periods.reduce(function(s,p){ return s+p.materias.length; },0);
    var materiasDone = Object.keys(state.academico.done).filter(function(k){ return state.academico.done[k]; }).length;
    var booksDone = state.reading.items.filter(function(b){ return b.status==="concluido"; }).length;

    var axisLabels = '<div class="axis-labels"><span>'+N+' dias atrás</span><span>hoje</span></div>';
    var evoIndex = computeEvolutionIndex();
    var evoColor = evoIndex>=70 ? "var(--ok)" : (evoIndex>=40 ? "var(--pess)" : "var(--warn)");

    el.innerHTML =
      '<div class="card">'+
        '<div class="section-head"><h2>Sua progressão</h2></div>'+
        '<p class="section-lede">Últimos '+N+' dias, calculado a partir do que você já vem marcando nas outras abas.</p>'+
        '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:6px 0 16px;">'+
          radialGauge(evoIndex, evoColor)+
          '<div style="flex:1;min-width:180px;">'+
            '<p class="kicker" style="margin-bottom:4px;">Índice geral de evolução</p>'+
            '<p style="font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin:0;">Média ponderada de todas as frentes (rotina, treino, dieta, estudos, leitura, metas e compras), usando as prioridades que você define na aba Projeções. Dívidas não entram aqui — acompanhe pelo card de dívidas quitadas abaixo.</p>'+
          '</div>'+
        '</div>'+
        '<div class="stat-tiles">'+
          '<div class="stat-tile tone-t"><p class="label">Sequência de treino</p><p class="value">'+streak+'</p><p class="hint">dia(s) seguidos</p></div>'+
          '<div class="stat-tile tone-t"><p class="label">Rotina — média 14 dias</p><p class="value">'+routineAvg+'%</p></div>'+
          '<div class="stat-tile tone-t"><p class="label">Água (14 dias)</p><p class="value">'+waterGoalDays+' / '+N+'</p><p class="hint">dias com 6+ copos</p></div>'+
          '<div class="stat-tile tone-ok"><p class="label">Dívidas quitadas</p><p class="value">'+debtsPago+' / '+state.debts.length+'</p></div>'+
          '<div class="stat-tile"><p class="label">Sebrae — disciplinas</p><p class="value">'+materiasDone+' / '+totalMaterias+'</p></div>'+
          '<div class="stat-tile"><p class="label">Livros concluídos</p><p class="value">'+booksDone+'</p></div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="chart-block">'+
          '<div class="chart-head"><span class="t">Rotina concluída por dia (%)</span><span class="v">média '+routineAvg+'%</span></div>'+
          barsSvg(routinePct, 100, function(v){ return v+"%"; })+
          axisLabels+
        '</div>'+
        '<div class="chart-block">'+
          '<div class="chart-head"><span class="t">Treino feito</span><span class="v">'+treinoHeat.filter(Boolean).length+' de '+N+' dias</span></div>'+
          '<div class="heat-row">'+treinoHeat.map(function(on){ return '<div class="d'+(on?" on":"")+'"></div>'; }).join("")+'</div>'+
          axisLabels+
        '</div>'+
        '<div class="chart-block">'+
          '<div class="chart-head"><span class="t">Copos de água por dia</span><span class="v">meta: 6+</span></div>'+
          barsSvg(waterVals, 8, function(v){ return v+" copo(s)"; })+
          axisLabels+
        '</div>'+
      '</div>';
  }

  // ---------- render: Projeções (revisão semanal) ----------
  var AREAS = [
    {key:"profissional", label:"Profissional", color:"--profissional", kind:"pct", eps:8, hint:"% da meta de setembro realizada",
      calc:function(s){ var k=s.professional.kpis; return {value: Math.round((k.realizado/k.metaSetembro)*1000)/10}; }},
    {key:"dividas", label:"Dívidas", color:"--warn", kind:"money", lowerIsBetter:true, hint:"valor total ainda pendente",
      calc:function(s){ var v=s.debts.filter(function(d){return d.status!=="pago";}).reduce(function(a,d){return a+(Number(d.value)||0);},0); return {value: Math.round(v*100)/100}; }},
    {key:"treino", label:"Treino", color:"--treino", kind:"pct", eps:8, hint:"dias treinados nos últimos 7",
      calc:function(s){ var c=0; for(var i=0;i<7;i++){ if(s.workout.log[todayKey(-i)]) c++; } return {value: Math.round((c/7)*100)}; }},
    {key:"rotina", label:"Rotina", color:"--rotina", kind:"pct", eps:8, hint:"cumprimento médio da rotina (7 dias)",
      calc:function(s){ var tot=s.routine.items.length||1, sum=0; for(var i=0;i<7;i++){ var log=s.routine.log[todayKey(-i)]||{}; sum += s.routine.items.filter(function(it){return log[it.id];}).length/tot; } return {value: Math.round((sum/7)*100)}; }},
    {key:"dieta", label:"Dieta", color:"--diet", kind:"pct", eps:8, hint:"dias com meta de água batida (7 dias)",
      calc:function(s){ var c=0; for(var i=0;i<7;i++){ var l=s.diet.log[todayKey(-i)]; if(l && l.water>=6) c++; } return {value: Math.round((c/7)*100)}; }},
    {key:"espirito", label:"Espiritualidade", color:"--fe", kind:"pct", eps:8, hint:"dias com devocional registrado (7 dias)",
      calc:function(s){ var c=0; for(var i=0;i<7;i++){ if(s.spirituality.dailyLog[todayKey(-i)]) c++; } return {value: Math.round((c/7)*100)}; }},
    {key:"academico", label:"Estudos Acadêmicos", color:"--academico", kind:"count", eps:1, hint:"disciplinas da grade concluídas",
      calc:function(s){ var tot=s.academico.periods.reduce(function(su,p){return su+p.materias.length;},0); var done=Object.keys(s.academico.done).filter(function(k){return s.academico.done[k];}).length; return {value: done, total: tot}; }},
    {key:"complementar", label:"Estudos Complementares", color:"--complementar", kind:"count", eps:1, hint:"itens de estudo concluídos",
      calc:function(s){ var all=[].concat(s.complementar.tripleten,s.complementar.copywriting,s.complementar.iaAnthropic,s.complementar.iaMicrosoft); var done=all.filter(function(i){return i.done;}).length; return {value: done, total: all.length}; }},
    {key:"leitura", label:"Leitura", color:"--leitura", kind:"count", eps:1, hint:"livros concluídos",
      calc:function(s){ var done=s.reading.items.filter(function(b){return b.status==="concluido";}).length; return {value: done, total: s.reading.items.length}; }},
    {key:"metas", label:"Metas & Sonhos", color:"--pess", kind:"count", eps:1, hint:"metas e sonhos em andamento",
      calc:function(s){ var v = s.goals.filter(function(g){return g.status==="andamento";}).length + s.dreams.filter(function(d){return d.status==="andamento";}).length; return {value:v, total: s.goals.length+s.dreams.length}; }},
    {key:"compras", label:"Compras", color:"--compras", kind:"pct", eps:12, hint:"itens já comprados da lista atual",
      calc:function(s){ var tot=s.shopping.items.length||1, done=s.shopping.items.filter(function(i){return i.checked;}).length; return {value: Math.round((done/tot)*100)}; }}
  ];

  // Concrete next-step suggestions per front — shown on an area's card whenever
  // that area is flagged "down" or "baseline" in the weekly comparison, so the
  // dashboard doesn't just show a number but a next action to move it.
  var AREA_ACTIONS = {
    profissional: "Priorizar hoje os clientes com cotação parada há mais tempo.",
    dividas: "Revisar o próximo boleto ou protesto a resolver esta semana.",
    treino: "Reagendar o treino perdido para os próximos 2 dias.",
    rotina: "Escolher 1 item da rotina para priorizar amanhã cedo.",
    dieta: "Deixar a garrafa de água visível como lembrete ao longo do dia.",
    espirito: "Reservar um horário fixo pro devocional amanhã.",
    academico: "Concluir 1 disciplina pendente esta semana.",
    complementar: "Retomar 1 item de estudo complementar parado.",
    leitura: "Separar 15 minutos de leitura hoje.",
    metas: "Escolher 1 meta \"planejada\" para virar \"em andamento\".",
    compras: "Fechar a compra da lista atual esta semana."
  };

  // Composite 0–100 score across every non-monetary front, weighted by the
  // priorities set in "Prioridades" — the headline number for the Progresso
  // dashboard gauge. Dívidas (a money-kind area) is excluded since it isn't a
  // 0–100 scale; it has its own card ("Dívidas quitadas").
  function computeEvolutionIndex(){
    var total = 0, weightSum = 0;
    AREAS.forEach(function(a){
      if(a.kind==="money") return;
      var m = a.calc(state);
      var pct = a.kind==="pct" ? m.value : (m.total ? (m.value/m.total)*100 : 0);
      pct = Math.max(0, Math.min(100, pct));
      var w = (state.areaWeights && state.areaWeights[a.key]) || 3;
      total += pct*w; weightSum += w;
    });
    return weightSum ? Math.round(total/weightSum) : 0;
  }

  function formatMetric(area, m){
    if(area.kind==="pct") return m.value+"%";
    if(area.kind==="money") return brl(m.value);
    return m.value + (m.total!=null ? " / "+m.total : "");
  }

  function statusFor(area, curVal, prevVal){
    if(prevVal==null) return {label:"linha de base", tone:"baseline", arrow:"–", deltaTxt:"primeira leitura"};
    var delta = curVal - prevVal;
    var eff = area.lowerIsBetter ? -delta : delta;
    var eps = area.kind==="money" ? Math.max(50, Math.abs(prevVal)*0.02) : (area.eps||1);
    var label, tone, arrow;
    if(eff > eps){ label="melhorou"; tone="up"; arrow="↑"; }
    else if(eff < -eps){ label="piorou"; tone="down"; arrow="↓"; }
    else { label="estável"; tone="flat"; arrow="→"; }
    var deltaTxt;
    if(area.kind==="money") deltaTxt = (delta>0?"+":"")+brl(delta);
    else if(area.kind==="pct") deltaTxt = (delta>0?"+":"")+delta+" pp";
    else deltaTxt = (delta>0?"+":"")+delta;
    return {label:label, tone:tone, arrow:arrow, deltaTxt:deltaTxt};
  }

  function microSpark(values, color){
    values = values.filter(function(v){ return v!=null && !isNaN(v); });
    if(values.length<2) return '<span class="mono" style="font-size:10px;color:var(--ink-faint);">sem histórico</span>';
    var w=88,h=26,max=Math.max.apply(null,values),min=Math.min.apply(null,values);
    var range = (max-min)||1;
    var pts = values.map(function(v,i){
      var x = (i/(values.length-1))*w;
      var y = h - ((v-min)/range)*h;
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block;overflow:visible;">'+
      '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '</svg>';
  }

  function getPrevMetrics(){
    var wk = isoWeekKey(new Date());
    var prior = state.weeklyReviews.filter(function(r){ return r.weekKey!==wk; });
    return prior.length ? prior[prior.length-1].metrics : null;
  }

  function doReview(){
    var wk = isoWeekKey(new Date());
    var cur = {};
    AREAS.forEach(function(a){ cur[a.key] = a.calc(state).value; });
    var noteEl = document.getElementById("projNote");
    var note = noteEl ? noteEl.value.trim() : "";
    var idx = state.weeklyReviews.findIndex(function(r){ return r.weekKey===wk; });
    var entry = {weekKey:wk, date: todayKey(), metrics:cur, note:note};
    if(idx>=0) state.weeklyReviews[idx] = entry; else state.weeklyReviews.push(entry);
    if(state.weeklyReviews.length>30) state.weeklyReviews = state.weeklyReviews.slice(-30);
    persist(); renderProjecoes(); renderHoje();
  }

  function renderProjecoes(){
    var el = document.getElementById("panel-projecoes");
    var wk = isoWeekKey(new Date());
    var prevMetrics = getPrevMetrics();
    var thisWeekEntry = state.weeklyReviews.find(function(r){ return r.weekKey===wk; });
    var reviewed = !!thisWeekEntry;
    var toneRank = {down:3, baseline:1.5, flat:1, up:0.3};

    var rows = AREAS.map(function(a){
      var m = a.calc(state);
      var prevVal = prevMetrics ? prevMetrics[a.key] : null;
      var st = statusFor(a, m.value, prevVal);
      var weight = state.areaWeights[a.key] || 3;
      var rank = (toneRank[st.tone]||1) * weight;
      var hist = state.weeklyReviews.slice(-7).map(function(r){ return r.metrics[a.key]; }).concat([m.value]);
      return {area:a, m:m, st:st, weight:weight, rank:rank, hist:hist};
    }).sort(function(x,y){ return y.rank-x.rank; });

    var upList = rows.filter(function(r){return r.st.tone==="up";}).sort(function(x,y){return y.weight-x.weight;}).slice(0,3);
    var downList = rows.filter(function(r){return r.st.tone==="down";}).sort(function(x,y){return y.weight-x.weight;}).slice(0,3);
    var hasHistory = prevMetrics!=null;

    el.innerHTML =
      '<div class="card">'+
        '<div class="section-head"><h2>Revisão semanal</h2>'+
          (reviewed?'<span class="chip" style="color:var(--ok);background:var(--ok-soft)">Revisado em '+esc(thisWeekEntry.date.split("-").reverse().join("/"))+'</span>':'<span class="chip">Ainda não revisado essa semana</span>')+
        '</div>'+
        '<p class="section-lede">Toda semana, de preferência aos domingos: veja em quais áreas você está evoluindo, quais estão travadas, e o que é mais importante focar agora. Os pesos definem a prioridade — ajuste quando sua vida mudar.</p>'+
        '<label class="field-label">Como foi a semana? (opcional)</label>'+
        '<textarea id="projNote" rows="2" placeholder="uma nota rápida sobre a semana...">'+esc(reviewed?thisWeekEntry.note:"")+'</textarea>'+
        '<div style="margin-top:12px;"><button class="btn primary" id="projReviewBtn" style="--tab-c:var(--projecoes)">'+(reviewed?"Atualizar revisão desta semana":"Fazer a revisão de domingo")+'</button></div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="section-head"><h2>Evoluindo &amp; precisando de atenção</h2></div>'+
        (hasHistory ?
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;">'+
            '<div class="callout tone-ok"><p class="co-title"><span class="mark"></span>Evoluindo</p>'+
              (upList.length? '<ul>'+upList.map(function(r){return '<li>'+esc(r.area.label)+' — '+esc(r.st.deltaTxt)+'</li>';}).join("")+'</ul>' : '<p style="font-size:12px;color:var(--ink-soft);margin:0;">Nenhuma área com melhora relevante nesta comparação.</p>')+
            '</div>'+
            '<div class="callout"><p class="co-title"><span class="mark"></span>Precisa de atenção</p>'+

  // ---------- render: Financeiro ----------
  function financeMonths(start,end){
    var result=[];
    for(var month=start;month<=end;month++) result.push("2026-"+String(month).padStart(2,"0"));
    return result;
  }
  function financeMonthLabel(key,options){
    var parts=key.split("-");
    return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString("pt-BR",options||{month:"short"});
  }
  function financeNumber(value){
    if(value===null||value===undefined||value==="") return null;
    var amount=Number(value);
    return Number.isFinite(amount)?amount:null;
  }
  function financeDisplay(value){
    var amount=financeNumber(value);
    return amount===null?"—":brl(amount);
  }
  function financeRecord(key){
    return state.finance.months[key]||{};
  }
  function financeInput(key,field,label,disabled){
    var value=financeNumber(financeRecord(key)[field]);
    return '<input type="number" '+(field==="income"?'min="0"':'')+' step="0.01" inputmode="decimal" data-fin-month="'+key+'" data-fin-field="'+field+'" aria-label="'+esc(label)+' — '+esc(financeMonthLabel(key,{month:"long"}))+'" value="'+(value===null?"":value)+'" placeholder="—" '+(disabled?"disabled":"")+'>';
  }
  function financeAverage(values){
    var valid=values.map(financeNumber).filter(function(value){return value!==null;});
    return valid.length?valid.reduce(function(sum,value){return sum+value;},0)/valid.length:null;
  }
  function financeSum(values){
    var valid=values.map(financeNumber).filter(function(value){return value!==null;});
    return valid.length?valid.reduce(function(sum,value){return sum+value;},0):null;
  }
  function financeChart(keys,fields,maxValue,stacked){
    return '<div class="finance-chart">'+keys.map(function(key){
      var record=financeRecord(key);
      return '<div class="finance-bar"><strong>'+(financeNumber(record[fields[0]])===null?"—":brl(financeNumber(record[fields[0]])))+'</strong>'+
        '<div class="finance-bar-track">'+fields.map(function(field,index){
          var amount=financeNumber(record[field]);
          var height=amount===null||!maxValue?0:Math.max(2,Math.min(100,amount/maxValue*100));
          var type=field==="homeJu"?"ju":(field==="homeTransfer"?"transfer":(field==="unidentified"?"unknown":""));
          return '<i class="'+type+'" style="height:'+height.toFixed(1)+'%" title="'+esc(field)+' · '+esc(financeDisplay(amount))+'"></i>';
        }).join("")+'</div><span>'+esc(financeMonthLabel(key))+'</span></div>';
    }).join("")+'</div>';
  }
  function financeCategoryRows(kind,items){
    if(!items.length) return '<div class="finance-empty">Ainda não há lançamentos categorizados. Os dados ausentes ficam em branco, não são tratados como R$ 0.</div>';
    return '<div class="finance-category-list">'+items.map(function(item){
      return '<div class="finance-category-row"><span>'+esc(item.category)+'</span><span class="month">'+esc(financeMonthLabel(item.month))+'</span><span class="amount">'+brl(Number(item.amount)||0)+'</span><button class="btn ghost" type="button" data-fin-delete="'+kind+'" data-fin-id="'+esc(item.id)+'" aria-label="Remover categoria '+esc(item.category)+'">Remover</button></div>';
    }).join("")+'</div>';
  }
  function financeComparison(label,first,second){
    if(first===null||second===null) return '<div class="stat-tile"><p class="label">'+label+'</p><p class="value">Aguardando dados</p><p class="hint">Preencha os meses de comparação para ver a variação.</p></div>';
    var delta=second-first, pct=first===0?null:delta/Math.abs(first)*100;
    return '<div class="stat-tile '+(delta>0?"tone-warn":(delta<0?"tone-ok":""))+'"><p class="label">'+label+'</p><p class="value">'+(delta>0?"+":"")+brl(delta)+'</p><p class="hint">'+(pct===null?"sem base percentual":(pct>0?"+":"")+pct.toFixed(1).replace(".",",")+"%")+' · antes '+brl(first)+' / depois '+brl(second)+'</p></div>';
  }
  function financeReportTrend(items,beforeLabel,afterLabel){
    return '<div class="finance-table-wrap"><table class="finance-table"><thead><tr><th>Setor/categoria</th><th>'+beforeLabel+'</th><th>'+afterLabel+'</th><th>Variação/mês</th><th>Sinal</th></tr></thead><tbody>'+
      items.map(function(item){
        var delta=item.delta===undefined?item.after-item.before:item.delta,up=delta>0.5,down=delta<-.5;
        return '<tr><td>'+esc(item.name)+'</td><td>'+brl(item.before)+'</td><td>'+brl(item.after)+'</td><td class="'+(up?"finance-bad":(down?"finance-good":""))+'">'+(delta>0?"+":"")+brl(delta)+'</td><td class="'+(up?"finance-bad":(down?"finance-good":""))+'">'+(up?"regressão":(down?"progresso":"estável"))+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }
  function renderFinanceiro(){
    var el=document.getElementById("panel-financeiro");
    var F=state.finance;
    if(!F||typeof F!=="object") F=state.finance={months:{},individualCategories:[],homeSectors:[],openingBalance:null,scenarios:{optimistic:1.25,base:1,conservative:.75}};
    if(!F.months||typeof F.months!=="object") F.months={};
    if(!Array.isArray(F.individualCategories)) F.individualCategories=[];
    if(!Array.isArray(F.homeSectors)) F.homeSectors=[];
    if(!F.scenarios) F.scenarios={optimistic:1.25,base:1,conservative:.75};
    var report=F.reportSnapshot||FINANCE_REPORT;
    F.reportSnapshot=report;
    var allMonths=financeMonths(1,10), personalMonths=financeMonths(3,10), homeMonths=financeMonths(1,8);
    var monthRows=allMonths.map(function(key){
      var personalOutside=key<"2026-03"||key>"2026-10";
      var homeOutside=key>"2026-10";
      var note=report.monthNotes[key]||"";
      return '<tr><td>'+esc(financeMonthLabel(key,{month:"long"}))+'</td>'+
        '<td>'+financeInput(key,"income","Entrada",personalOutside)+'</td>'+
        '<td>'+financeInput(key,"individual","Gasto individual",personalOutside)+'</td>'+
        '<td>'+financeInput(key,"homeJu","Lar pago diretamente pela Ju",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"homeTransfer","PIX ao André",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"homeAndre","Lar pago pelo André",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"andreForJu","André pagou por Ju, fora do custo do Lar",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"unidentified","A identificar",personalOutside)+'</td>'+
        '<td>'+financeDisplay(financeRecord(key).cashFlow)+'</td><td class="finance-month-note">'+(note?"* "+esc(note):"")+'</td></tr>';
    }).join("");
    var personalIn=financeSum(personalMonths.map(function(key){return financeRecord(key).income;}));
    var individualOut=financeSum(personalMonths.map(function(key){return financeRecord(key).individual;}));
    var houseJu=financeSum(homeMonths.map(function(key){var r=financeRecord(key);return financeNumber(r.homeJu)===null&&financeNumber(r.homeTransfer)===null?null:(financeNumber(r.homeJu)||0)+(financeNumber(r.homeTransfer)||0);}));
    var houseJuPersonal=financeSum(personalMonths.map(function(key){var r=financeRecord(key);return financeNumber(r.homeJu)===null&&financeNumber(r.homeTransfer)===null?null:(financeNumber(r.homeJu)||0)+(financeNumber(r.homeTransfer)||0);}));
    var houseAndre=financeSum(homeMonths.map(function(key){return financeRecord(key).homeAndre;}));
    var unknownOut=financeSum(personalMonths.map(function(key){return financeRecord(key).unidentified;}));
    var monthlyMax=Math.max.apply(null,personalMonths.reduce(function(values,key){
      var record=financeRecord(key);
      ["income","individual","homeJu","homeAndre","unidentified"].forEach(function(field){
        var value=financeNumber(record[field]);if(value!==null) values.push(value);
      });
      return values;
    },[0]));
    var individualTotals={};
    report.individual.categories.forEach(function(item){individualTotals[item.name]=item.value;});
    F.individualCategories.forEach(function(item){var key=item.category;individualTotals[key]=(individualTotals[key]||0)+(Number(item.amount)||0);});
    var individualCategoryHtml=Object.keys(individualTotals).length?'<div class="finance-category-list">'+Object.keys(individualTotals).sort().map(function(category){
      return '<div class="finance-category-row"><span>'+esc(category)+'</span><span class="month">Mar–out/2026</span><span class="amount">'+brl(individualTotals[category])+'</span><span></span></div>';
    }).join("")+'</div>':'<div class="finance-empty">Adicione gastos individuais por categoria para visualizar para onde o dinheiro está indo.</div>';
    var sectorTotals={};
    report.home.categories.forEach(function(item){sectorTotals[item.name]=item.value;});
    F.homeSectors.forEach(function(item){var key=item.category;sectorTotals[key]=(sectorTotals[key]||0)+(Number(item.amount)||0);});
    var homeMonthsRecorded=homeMonths.filter(function(key){
      var record=financeRecord(key);return financeNumber(record.homeJu)!==null&&financeNumber(record.homeAndre)!==null;
    });
    var homeCostByMonth=homeMonths.map(function(key){
      var record=financeRecord(key),ju=financeNumber(record.homeJu),andre=financeNumber(record.homeAndre);
      return ju===null||andre===null?null:ju+andre;
    });
    var homeCostTotal=financeSum(homeCostByMonth);
    var homeCostAverage=financeAverage(homeCostByMonth);
    var individualFirst=financeAverage(["2026-04","2026-05","2026-06"].map(function(key){return financeRecord(key).individual;}));
    var individualRecent=financeAverage(["2026-09","2026-10"].map(function(key){return financeRecord(key).individual;}));
    var homeFirst=financeAverage(["2026-01","2026-02","2026-03","2026-04"].map(function(key){var r=financeRecord(key);var a=financeNumber(r.homeJu),b=financeNumber(r.homeAndre);return a===null||b===null?null:a+b;}));
    var homeRecent=financeAverage(["2026-05","2026-06","2026-07","2026-08"].map(function(key){var r=financeRecord(key);var a=financeNumber(r.homeJu),b=financeNumber(r.homeAndre);return a===null||b===null?null:a+b;}));
    var completeHomeMonths=homeMonths.filter(function(key){var r=financeRecord(key);return financeNumber(r.homeJu)!==null&&financeNumber(r.homeAndre)!==null;});
    var knownDeltas=completeHomeMonths.map(function(key){
      var r=financeRecord(key),ju=financeNumber(r.homeJu),andre=financeNumber(r.homeAndre);
      return ju+(financeNumber(r.homeTransfer)||0)-(ju+andre)/2-(financeNumber(r.andreForJu)||0);
    });
    var currentSettlement=financeNumber(F.openingBalance);
    if(currentSettlement!==null) currentSettlement+=knownDeltas.reduce(function(sum,value){return sum+value;},0);
    var averageDelta=financeAverage(knownDeltas.slice(-3));
    var scenarioValues=averageDelta===null?null:{
      base:averageDelta*(Number(F.scenarios.base)||1),
      optimistic:averageDelta*(Number(F.scenarios.optimistic)||1.25),
      conservative:averageDelta*(Number(F.scenarios.conservative)||.75)
    };
    var scenarioCard=function(key,label,description){
      if(currentSettlement===null||scenarioValues===null) return '<div class="finance-scenario"><strong>'+label+'</strong><span>Inclua saldo de abertura e pelo menos um mês completo (valores pagos por ambos) para projetar.</span></div>';
      var rate=scenarioValues[key],monthsToZero=currentSettlement>=0?0:(rate>0?Math.ceil(Math.abs(currentSettlement)/rate):null);
      var result=monthsToZero===0?"Acerto já está zerado":(monthsToZero===null?"Sem previsão de quitação neste ritmo":"Pode zerar em cerca de "+monthsToZero+" mês(es)");
      return '<div class="finance-scenario"><strong>'+label+'</strong><span>'+description+' · variação estimada '+brl(rate)+'/mês. '+result+'.</span></div>';
    };
    var latestDate=new Date();
    var projectionRows='<div class="finance-projection-row head"><span>Mês</span><span>Base</span><span>Otimista</span><span>Conservador</span></div>';
    var projectionValues={base:currentSettlement,optimistic:currentSettlement,conservative:currentSettlement};
    var projectionHtml="";
    if(currentSettlement!==null&&scenarioValues!==null){
      for(var pi=0;pi<12;pi++){
        latestDate.setMonth(latestDate.getMonth()+1);
        var label=latestDate.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(".","");
        ["base","optimistic","conservative"].forEach(function(key){projectionValues[key]+=scenarioValues[key];});
        projectionHtml+='<div class="finance-projection-row"><span>'+esc(label)+'</span>'+["base","optimistic","conservative"].map(function(key){
          var value=projectionValues[key];return '<span class="'+(value<0?"finance-bad":"finance-good")+'">'+brl(value)+'</span>';
        }).join("")+'</div>';
      }
    }
    var sectorHtml=Object.keys(sectorTotals).length?'<div class="finance-category-list">'+Object.keys(sectorTotals).sort().map(function(category){
      return '<div class="finance-category-row"><span>'+esc(category)+'</span><span class="month">Jan–ago/2026</span><span class="amount">'+brl(sectorTotals[category])+'</span><span></span></div>';
    }).join("")+'</div>':'<div class="finance-empty">Nenhum setor do Lar foi informado. Adicione os valores setorizados abaixo; totais sem informação não são tratados como zero.</div>';
    var expenseMax=Math.max.apply(null,Object.keys(individualTotals).map(function(key){return individualTotals[key];}).concat([1]));
    var sectorMax=Math.max.apply(null,Object.keys(sectorTotals).map(function(key){return sectorTotals[key];}).concat([1]));
    function categoryBars(totals,max){
      return Object.keys(totals).length?'<div class="finance-chart">'+Object.keys(totals).sort(function(a,b){return totals[b]-totals[a];}).map(function(category){
        var amount=totals[category];return '<div class="finance-bar"><strong>'+brl(amount)+'</strong><div class="finance-bar-track"><i style="height:'+Math.max(2,amount/max*100).toFixed(1)+'%"></i></div><span>'+esc(category.slice(0,12))+'</span></div>';
      }).join("")+'</div>':'';
    }
    el.innerHTML=
      '<div class="finance-note"><strong>Atualizado pelo relatório de '+esc(report.generated)+'.</strong> '+esc(report.quality.total+' lançamentos: '+report.quality.selected+' setorizados pela Ju, '+report.quality.automatic+' classificados automaticamente e '+report.quality.suggested+' ainda seguem uma sugestão provisória.')+' O resumo mantém essas classificações como vieram no arquivo; confira os itens sugeridos antes de tratar os totais como definitivos.</div>'+
      '<div class="stat-tiles">'+
        '<div class="stat-tile tone-t"><p class="label">Entradas mar–out</p><p class="value">'+brl(report.individual.total.income)+'</p><p class="hint">Salário '+brl(report.individual.total.salary)+' · Flash '+brl(report.individual.total.flash)+'</p></div>'+
        '<div class="stat-tile"><p class="label">Gastos individuais</p><p class="value">'+brl(report.individual.total.spending)+'</p><p class="hint">Mar–out · relatório recebido</p></div>'+
        '<div class="stat-tile"><p class="label">Lar — contribuição Ju</p><p class="value">'+brl(report.individual.total.homeContribution)+'</p><p class="hint">Contas pagas + PIX ao André · mar–out</p></div>'+
        '<div class="stat-tile tone-warn"><p class="label">A identificar</p><p class="value">'+brl(report.individual.total.unidentified)+'</p><p class="hint">Sem classificação confirmada</p></div>'+
      '</div>'+
      '<div class="card"><div class="section-head"><h2>Entradas e saídas por mês</h2><span class="chip on-tab">Mar–out · R$</span></div>'+
        '<p class="section-lede">Valores importados do resumo financeiro; edite os campos quando tiver correções confirmadas. Lançamentos negativos representam estorno/crédito. Saldo mensal é o saldo informado no relatório.</p>'+
        '<div class="stat-tiles">'+
          '<div class="stat-tile tone-t"><p class="label">Entradas registradas</p><p class="value">'+financeDisplay(personalIn)+'</p></div>'+
          '<div class="stat-tile"><p class="label">Gastos individuais</p><p class="value">'+financeDisplay(individualOut)+'</p></div>'+
          '<div class="stat-tile"><p class="label">Lar — Ju, pagos + PIX</p><p class="value">'+financeDisplay(houseJuPersonal)+'</p></div>'+
          '<div class="stat-tile"><p class="label">A identificar</p><p class="value">'+financeDisplay(unknownOut)+'</p></div>'+
        '</div>'+
        '<div class="finance-legend"><span><i></i>Entradas</span><span><i class="ju"></i>Gastos individuais</span><span><i class="transfer"></i>Lar · Ju + PIX</span><span><i class="unknown"></i>A identificar</span></div>'+
        '<div class="finance-chart">'+personalMonths.map(function(key){
          var r=financeRecord(key),bars=[["income",financeNumber(r.income),"","Entradas"],["individual",financeNumber(r.individual),"spending","Gastos individuais"],["homeJu",(financeNumber(r.homeJu)||0)+(financeNumber(r.homeTransfer)||0),"transfer","Lar · Ju + PIX"],["unidentified",financeNumber(r.unidentified),"unknown","A identificar"]];

      '</div>'+
      '<div class="card"><div class="section-head"><h2>Projeção: quando o acerto zera</h2><span class="chip">12 meses · cenários</span></div>'+

        (projectionHtml?'<div style="margin-top:16px;">'+projectionRows+projectionHtml+'</div>':'')+
      '</div>'+
      '<div class="card"><div class="section-head"><h2>Custo do Lar por setor</h2><span class="chip">Jan–ago · total e média/mês</span></div>'+
        '<p class="section-lede">Valores e médias conforme o relatório. Setores são detalhamento dos totais mensais, não devem ser somados novamente ao acerto.</p>'+
        '<div class="stat-tiles"><div class="stat-tile"><p class="label">Total setorizado</p><p class="value">'+(Object.keys(sectorTotals).length?brl(Object.keys(sectorTotals).reduce(function(sum,key){return sum+sectorTotals[key];},0)):"—")+'</p></div>'+
          '<div class="stat-tile"><p class="label">Média por mês completo</p><p class="value">'+financeDisplay(homeCostAverage)+'</p></div></div>'+
        sectorHtml+
      '</div>'+
      '<div class="card"><div class="section-head"><h2>Progressos e regressões do Lar</h2><span class="chip">jan–abr × mai–ago</span></div>'+
        financeReportTrend(report.home.progress,"Jan–abr · média","Mai–ago · média")+
      '</div>'+
      '<div class="card"><div class="section-head"><h2>Projeção do custo do Lar</h2><span class="chip">próximos 12 meses</span></div>'+
        '<p class="section-lede">Estimativa do relatório pela média de janeiro a agosto, mantendo os preços atuais. Rebill (faculdade) e TIM (celular) são pessoais e ficaram fora do Lar.</p>'+
        '<div class="stat-tiles"><div class="stat-tile"><p class="label">Fixos por mês</p><p class="value">'+brl(report.home.projection.fixed)+'</p><p class="hint">Aluguel '+brl(report.home.projection.rent)+' · energia '+brl(report.home.projection.energy)+' · água '+brl(report.home.projection.water)+' · internet '+brl(report.home.projection.internet)+'</p></div><div class="stat-tile"><p class="label">Variáveis por mês</p><p class="value">'+brl(report.home.projection.variable)+'</p></div><div class="stat-tile"><p class="label">Custo médio mensal</p><p class="value">'+brl(report.home.projection.monthly)+'</p></div><div class="stat-tile"><p class="label">Próximos 12 meses</p><p class="value">'+brl(report.home.projection.year)+'</p><p class="hint">Metade da Ju: '+brl(report.home.projection.juShare)+'/mês</p></div></div>'+
      '</div>'+
      '<div class="card"><div class="section-head"><h2>Projeção do acerto conforme o relatório</h2><span class="chip">out/2026–out/2027</span></div>'+
        '<p class="section-lede">Ponto de partida informado: '+brl(report.individual.projection.start)+'. Premissas mensais: Flash '+brl(report.individual.projection.flash)+', metade do Lar '+brl(report.individual.projection.homeShare)+' e gastos individuais '+brl(report.individual.projection.individualSpending)+'. São cenários, não garantias.</p>'+
        '<div class="finance-scenario-grid">'+["conservative","base","optimistic"].map(function(key){var p=report.individual.projection[key],first=p.series.findIndex(function(v){return v>=0;});var result=first<0?"Acerto não zera nos próximos 12 meses":"Cruza zero em "+first+" mês(es) · "+financeMonthLabel(report.individual.projection.months[first],{month:"long",year:"numeric"});return '<div class="finance-scenario"><strong>'+({conservative:"Conservador",base:"Base",optimistic:"Otimista"}[key])+'</strong><span>Sobra estimada '+brl(p.surplus)+'/mês. '+result+'.</span></div>';}).join("")+'</div>'+
        '<div class="finance-projection-row head"><span>Mês</span><span>Conservador</span><span>Base</span><span>Otimista</span></div>'+
        report.individual.projection.months.slice(1).map(function(month,index){var rowIndex=index+1;return '<div class="finance-projection-row"><span>'+esc(financeMonthLabel(month,{month:"short",year:"2-digit"}))+'</span>'+["conservative","base","optimistic"].map(function(key){var value=report.individual.projection[key].series[rowIndex];return '<span class="'+(value<0?"finance-bad":"finance-good")+'">'+brl(value)+'</span>';}).join("")+'</div>';}).join("")+
        '<p class="section-lede">Salário: conservador '+brl(report.individual.projection.salaryConservative)+' (abr–jun), base '+brl(report.individual.projection.salaryBase)+' (média incluindo outubro), otimista '+brl(report.individual.projection.salaryOptimistic)+' (outubro). A premissa conservadora aumenta gastos individuais em 10%.</p>'+
      '</div>'+
      '<div class="finance-note warning"><strong>Fontes e limitações · relatório de '+esc(report.generated)+'.</strong> '+esc(report.sources)+' '+esc(report.missing)+' Valores de setembro e outubro têm cobertura parcial; o arquivo não trouxe a fatura do André nesses meses. Sugestões de setor permanecem provisórias e os totais podem mudar quando os pendentes forem confirmados.</div>';

    el.querySelectorAll("[data-fin-month]").forEach(function(input){
      input.addEventListener("change",function(){
        var key=input.dataset.finMonth,field=input.dataset.finField;
        F.months[key]=F.months[key]||{};
        F.months[key][field]=input.value===""?null:Number(input.value);
        persist();renderFinanceiro();
      });
    });
    var opening=el.querySelector("#finOpeningBalance");
    if(opening) opening.addEventListener("change",function(){
      F.openingBalance=opening.value===""?null:Number(opening.value);
      persist();renderFinanceiro();
    });
    var individualAdd=el.querySelector("#finIndividualAdd");
    if(individualAdd) individualAdd.addEventListener("click",function(){
      var category=el.querySelector("#finIndividualCategory").value.trim(),amount=financeNumber(el.querySelector("#finIndividualAmount").value);
      if(!category||amount===null) return;
      F.individualCategories.push({id:uid("ind"),category:category,month:el.querySelector("#finIndividualMonth").value,amount:amount});
      persist();renderFinanceiro();
    });
    var homeAdd=el.querySelector("#finHomeAdd");
    if(homeAdd) homeAdd.addEventListener("click",function(){
      var category=el.querySelector("#finHomeCategory").value.trim(),amount=financeNumber(el.querySelector("#finHomeAmount").value);
      if(!category||amount===null) return;
      F.homeSectors.push({id:uid("home"),category:category,month:el.querySelector("#finHomeMonth").value,amount:amount});
      persist();renderFinanceiro();
    });
    el.querySelectorAll("[data-fin-delete]").forEach(function(button){
      button.addEventListener("click",function(){
        var list=button.dataset.finDelete==="home"?F.homeSectors:F.individualCategories;
        if(!window.confirm("Remover este lançamento?"))return;
        if(button.dataset.finDelete==="home") F.homeSectors=list.filter(function(item){return item.id!==button.dataset.finId;});
        else F.individualCategories=list.filter(function(item){return item.id!==button.dataset.finId;});
        persist();renderFinanceiro();

  }

  function renderAll(){
    renderMetas(); renderDividas(); renderDieta(); renderTreino(); renderRotina(); renderCompras();
    renderLeitura(); renderEspiritualidade(); renderAcademico(); renderComplementar(); renderProfissional();
    renderProjecoes(); renderHoje(); renderProgresso(); renderFinanceiro();
  }

  // ---------- tabs ----------
  function initTabs(){
    var btns = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
    var saved = "hoje";
    try{ saved = localStorage.getItem("painelJuTab") || "hoje"; }catch(e){}
    function activate(tab){
      btns.forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab===tab)); });
      ["hoje","metas","dividas","dieta","treino","rotina","compras","leitura","espirito","academico","complementar","profissional","progresso","projecoes","financeiro"].forEach(function(t){
        document.getElementById("panel-"+t).hidden = (t!==tab);
      });
      try{ localStorage.setItem("painelJuTab", tab); }catch(e){}
    }
    btns.forEach(function(b){ b.addEventListener("click", function(){ activate(b.dataset.tab); }); });
    activate(btns.some(function(b){return b.dataset.tab===saved;}) ? saved : "hoje");
    window.__painelGoTo = activate;
  }

  function initToday(){
    var el = document.getElementById("todayLabel");
    var d = new Date();
    var txt = d.toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
    el.textContent = txt.charAt(0).toUpperCase()+txt.slice(1);
  }

  // ---------- one-time repair: heal saved data left in an old shape ----------
  // mergeDefaults() only fills in keys the saved doc never had — it never overwrites
  // a key that's already there, even if that key's *shape* is stale from an older
  // version of the app. That's correct for most fields (we don't want to blow away
  // your checkboxes), but it means a saved "professional" object from before the
  // 28/09 rebuild had no .phases array (renderProfissional() crashed reading it,
  // which is why the tab looked empty), and new debt entries never appear on a
  // saved "debts" array that predates them. This patches both without touching
  // anything else you've already filled in.
  function reconcileState(){
    var healed = false;
    if(!state.professional || !Array.isArray(state.professional.phases)){
      // Preserve any action items she's already ticked in "Plano de ação" — a shape
      // rebuild should never erase what she's checked off, only fix the structure.
      var oldProfLog = (state.professional && state.professional.log) || {};
      state.professional = cloneDefaults().professional;
      state.professional.log = oldProfLog;
      healed = true;
    }
    var defDebts = cloneDefaults().debts;
    var haveIds = {};
    state.debts.forEach(function(d){ haveIds[d.id] = true; });
    defDebts.forEach(function(d){
      if(!haveIds[d.id]){ state.debts.push(d); healed = true; }
    });
    // Guard the user's own added data (e.g. books in Leitura) against ever being
    // silently lost to a future shape change: never replace state.reading wholesale,
    // only patch it into a safe shape if it's missing or corrupted, preserving any
    // items already saved.
    if(!state.reading || typeof state.reading !== "object"){
      state.reading = {items:[], targetPerMonth:1};
      healed = true;
    } else if(!Array.isArray(state.reading.items)){
      state.reading.items = [];
      healed = true;
    }
    if(!Array.isArray(state.agenda)){
      state.agenda = [];
      healed = true;
    }
    if(typeof state.reading.targetPerMonth !== "number"){
      state.reading.targetPerMonth = 1;
      healed = true;
    }
    var finance=state.finance;
    if(!finance||typeof finance!=="object"){
      finance=state.finance={months:{},individualCategories:[],homeSectors:[],openingBalance:null,scenarios:{optimistic:1.25,base:1,conservative:.75}};
      healed=true;
    }
    if(!finance.months||typeof finance.months!=="object"){finance.months={};healed=true;}
    if(!Array.isArray(finance.individualCategories)){finance.individualCategories=[];healed=true;}
    if(!Array.isArray(finance.homeSectors)){finance.homeSectors=[];healed=true;}
    if(!finance.scenarios) finance.scenarios={optimistic:1.25,base:1,conservative:.75};
    if(finance.reportVersion!==FINANCE_REPORT.version){
      finance.reportSnapshot=JSON.parse(JSON.stringify(FINANCE_REPORT));
      Object.keys(FINANCE_REPORT.months).forEach(function(key){
        var target=finance.months[key]||(finance.months[key]={});
        var source=FINANCE_REPORT.months[key];
        Object.keys(source).forEach(function(field){
          var previousDefault=key==="2026-09"&&
            ((field==="income"&&target[field]===4013.85)||(field==="homeAndre"&&target[field]===1801.80));
          if(previousDefault||target[field]===undefined||target[field]===null){
            if(source[field]!==null||previousDefault) target[field]=source[field];
          }
        });
      });
      finance.reportVersion=FINANCE_REPORT.version;
      healed=true;
    }
    return healed;
  }

  async function init(){
    initToday();
    initTabs();
    initBackups();
    setSaveStatus("saving", "Carregando seus dados…");
    try{
      var saved=localStorage.getItem(LOCAL_DATA_KEY);
      state=saved?mergeDefaults(JSON.parse(saved)):cloneDefaults();
      stateDoc={set:function(value){
        try{localStorage.setItem(LOCAL_DATA_KEY,JSON.stringify(value));return Promise.resolve();}
        catch(error){return Promise.reject(error);}
      }};
      if(!saved){
        var previous=localStorage.getItem(PREVIOUS_DATA_KEY);
        if(previous){
          migratePreviousPanel(JSON.parse(previous));
          await stateDoc.set(state);
        }
      }
      if(reconcileState()) await stateDoc.set(state);
      setSaveStatus("ok","Salvo neste dispositivo");
    }catch(e){
      console.error("Falha ao carregar o painel salvo:",e);
      state = cloneDefaults();
      stateDoc = null;
      setSaveStatus("error", "Falha no armazenamento local — exporte/restaure backup em outro navegador");
    }
    renderAll();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
